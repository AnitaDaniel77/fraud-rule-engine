# runs on GitHub's servers every time code is pushed
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-docker:
    # a fresh Linux machine with a normal internet connection
    runs-on: ubuntu-latest
    steps:
      # download the repository onto that machine
      - name: Get the code
        uses: actions/checkout@v4

      # install Java 21 and keep downloaded libraries between runs
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # run all 19 tests
      - name: Run the tests
        run: ./mvnw -B test

      # build the image from the Dockerfile
      - name: Build the Docker image
        run: docker build -t fraud-rule-engine .

      # start the container and wait up to 60 seconds for it to report UP
      - name: Start the container and check health
        run: |
          docker run -d --name fraud -p 8080:8080 fraud-rule-engine
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then
              echo "Service is up"
              exit 0
            fi
            sleep 2
          done
          docker logs fraud
          exit 1
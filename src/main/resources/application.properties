spring.application.name=fraud-rule-engine

# H2 saved to a file, so data survives a restart
spring.datasource.url=jdbc:h2:file:./data/fraud
spring.datasource.username=sa
spring.datasource.password=

# create the tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# release the database connection before the response is sent
spring.jpa.open-in-view=false